<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 920" width="100%" height="100%" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Subtle dot grid pattern (ByteByteGo signature canvas feel) -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.55"/>
    </pattern>

    <!-- Soft drop shadow for cards -->
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- Arrowhead markers -->
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C"/>
    </marker>
    <marker id="arrowDB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="920" rx="16" fill="#FAFBFD" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect width="880" height="920" rx="16" fill="url(#dotGrid)"/>

  <!-- ==================== 1. CLIENT APPLICATION ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="36" width="640" height="68" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <!-- Browser/Client Icon -->
    <rect x="305" y="55" width="28" height="22" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="305" y1="62" x2="333" y2="62" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="310" cy="58.5" r="1.2" fill="#2563EB"/>
    <circle cx="314" cy="58.5" r="1.2" fill="#2563EB"/>
    <text x="458" y="73" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A" letter-spacing="-0.2">Client Application</text>
  </g>

  <!-- Arrow: Client -> API Host -->
  <line x1="440" y1="104" x2="440" y2="162" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowSlate)"/>
  <!-- Request Context Pill Badge -->
  <rect x="454" y="117" width="284" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="596" y="135" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#334155">HTTP + JWT Bearer + X-Workspace-Id</text>

  <!-- ==================== 2. API HOST (ASP.NET CORE) ==================== -->
  <g filter="url(#cardShadow)">
    <!-- Outer Container -->
    <rect x="120" y="168" width="640" height="196" rx="12" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2.2"/>
    
    <!-- Header Section -->
    <text x="440" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#312E81" letter-spacing="-0.2">API Host (ASP.NET Core)</text>
    
    <!-- Middleware Pipeline Pill -->
    <rect x="210" y="214" width="460" height="28" rx="6" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
    <text x="440" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#4338CA">JWT Auth  ·  Workspace Middleware  ·  Bus Outbox</text>

    <!-- Horizontal Divider -->
    <line x1="120" y1="256" x2="760" y2="256" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Inner Module 1: Identity Module -->
    <rect x="140" y="270" width="184" height="78" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8"/>
    <rect x="140" y="270" width="6" height="78" rx="3" fill="#6366F1"/>
    <text x="235" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Identity</text>
    <text x="235" y="325" text-anchor="middle" font-size="13" font-weight="500" fill="#64748B">Module</text>

    <!-- Inner Module 2: Workspaces Module -->
    <rect x="348" y="270" width="184" height="78" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8"/>
    <rect x="348" y="270" width="6" height="78" rx="3" fill="#6366F1"/>
    <text x="443" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Workspaces</text>
    <text x="443" y="325" text-anchor="middle" font-size="13" font-weight="500" fill="#64748B">Module</text>

    <!-- Inner Module 3: Workflows Module -->
    <rect x="556" y="270" width="184" height="78" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8"/>
    <rect x="556" y="270" width="6" height="78" rx="3" fill="#6366F1"/>
    <text x="651" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Workflows</text>
    <text x="651" y="325" text-anchor="middle" font-size="13" font-weight="500" fill="#64748B">Module</text>
  </g>

  <!-- 3 Arrows: Modules -> RabbitMQ -->
  <line x1="232" y1="364" x2="232" y2="416" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrowIndigo)"/>
  <line x1="440" y1="364" x2="440" y2="416" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrowIndigo)"/>
  <line x1="648" y1="364" x2="648" y2="416" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrowIndigo)"/>

  <!-- ==================== 3. RABBITMQ (VIA MASSTRANSIT) ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="422" width="640" height="92" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.2"/>
    
    <!-- Message Queue Icon Badge -->
    <g transform="translate(272, 441)">
      <rect x="0" y="0" width="26" height="22" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.8"/>
      <line x1="6" y1="6" x2="6" y2="16" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="13" y1="6" x2="13" y2="16" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="20" y1="6" x2="20" y2="16" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
    </g>

    <text x="458" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#9A3412" letter-spacing="-0.2">RabbitMQ (via MassTransit)</text>
    
    <rect x="235" y="472" width="410" height="26" rx="6" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1.2"/>
    <text x="440" y="489" text-anchor="middle" font-size="13" font-weight="600" fill="#C2410C">Commands  ·  Events  ·  Transactional Outbox</text>
  </g>

  <!-- 2 Arrows: RabbitMQ -> Worker Host & Scheduler Host -->
  <line x1="270" y1="514" x2="270" y2="566" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arrowOrange)"/>
  <line x1="610" y1="514" x2="610" y2="566" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arrowOrange)"/>

  <!-- ==================== 4A. WORKER HOST ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="572" width="300" height="168" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
    <!-- Header Banner -->
    <path d="M 120 584 Q 120 572 132 572 L 408 572 Q 420 572 420 584 L 420 614 L 120 614 Z" fill="#D1FAE5"/>
    <line x1="120" y1="614" x2="420" y2="614" stroke="#059669" stroke-width="1.5"/>
    <!-- Gear/Worker Icon -->
    <circle cx="195" cy="593" r="7" fill="none" stroke="#065F46" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="195" cy="593" r="2.5" fill="#065F46"/>
    <text x="278" y="599" text-anchor="middle" font-size="17" font-weight="700" fill="#065F46">Worker Host</text>

    <!-- Feature Pills inside Worker Host -->
    <rect x="142" y="626" width="256" height="28" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
    <circle cx="158" cy="640" r="3.5" fill="#10B981"/>
    <text x="172" y="645" font-size="13.5" font-weight="600" fill="#064E3B">Saga State Machine</text>

    <rect x="142" y="662" width="256" height="28" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
    <circle cx="158" cy="676" r="3.5" fill="#10B981"/>
    <text x="172" y="681" font-size="13.5" font-weight="600" fill="#064E3B">Step Executors</text>

    <rect x="142" y="698" width="256" height="28" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
    <circle cx="158" cy="712" r="3.5" fill="#10B981"/>
    <text x="172" y="717" font-size="13.5" font-weight="600" fill="#064E3B">Consumer Outbox</text>
  </g>

  <!-- ==================== 4B. SCHEDULER HOST ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="572" width="300" height="168" rx="12" fill="#ECFEFF" stroke="#0891B2" stroke-width="2.2"/>
    <!-- Header Banner -->
    <path d="M 460 584 Q 460 572 472 572 L 748 572 Q 760 572 760 584 L 760 614 L 460 614 Z" fill="#CFFAFE"/>
    <line x1="460" y1="614" x2="760" y2="614" stroke="#0891B2" stroke-width="1.5"/>
    <!-- Clock/Scheduler Icon -->
    <circle cx="526" cy="593" r="7.5" fill="none" stroke="#155E75" stroke-width="1.8"/>
    <polyline points="526,588.5 526,593 529.5,595" fill="none" stroke="#155E75" stroke-width="1.8" stroke-linecap="round"/>
    <text x="618" y="599" text-anchor="middle" font-size="17" font-weight="700" fill="#155E75">Scheduler Host</text>

    <!-- Feature Pills inside Scheduler Host -->
    <rect x="482" y="626" width="256" height="28" rx="6" fill="#FFFFFF" stroke="#67E8F9" stroke-width="1.4"/>
    <circle cx="498" cy="640" r="3.5" fill="#06B6D4"/>
    <text x="512" y="645" font-size="13.5" font-weight="600" fill="#164E63">Quartz.NET Cron Jobs</text>

    <rect x="482" y="662" width="256" height="28" rx="6" fill="#FFFFFF" stroke="#67E8F9" stroke-width="1.4"/>
    <circle cx="498" cy="676" r="3.5" fill="#06B6D4"/>
    <text x="512" y="681" font-size="13.5" font-weight="600" fill="#164E63">Occurrence → StartExecution</text>

    <rect x="482" y="698" width="256" height="28" rx="6" fill="#FFFFFF" stroke="#67E8F9" stroke-width="1.4"/>
    <circle cx="498" cy="712" r="3.5" fill="#06B6D4"/>
    <text x="512" y="717" font-size="13.5" font-weight="600" fill="#164E63">Bus Outbox</text>
  </g>

  <!-- 2 Arrows: Worker Host & Scheduler Host -> PostgreSQL 15 -->
  <line x1="270" y1="740" x2="270" y2="792" stroke="#0284C7" stroke-width="2.2" marker-end="url(#arrowDB)"/>
  <line x1="610" y1="740" x2="610" y2="792" stroke="#0284C7" stroke-width="2.2" marker-end="url(#arrowDB)"/>

  <!-- ==================== 5. POSTGRESQL 15 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="798" width="640" height="88" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.2"/>
    
    <!-- Database Cylinder Icon -->
    <g transform="translate(332, 814)">
      <ellipse cx="12" cy="5" rx="10" ry="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
      <path d="M2 5 v14 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4 V5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
      <path d="M2 12 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4" fill="none" stroke="#0284C7" stroke-width="1.5"/>
    </g>

    <text x="442" y="833" text-anchor="middle" font-size="18" font-weight="700" fill="#0C4A6E" letter-spacing="-0.2">PostgreSQL 15</text>

    <rect x="215" y="846" width="450" height="26" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.2"/>
    <text x="440" y="863" text-anchor="middle" font-size="13" font-weight="600" fill="#0369A1">EF Core  ·  Saga State  ·  Outbox  ·  Identity Tables</text>
  </g>
</svg>