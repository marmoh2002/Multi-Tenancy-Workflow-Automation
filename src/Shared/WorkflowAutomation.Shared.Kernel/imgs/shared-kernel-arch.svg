<svg id="standaloneAnimatedSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%">
              <defs>
                <pattern id="bbgGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                  <circle cx="2" cy="2" r="1" fill="#1e293b"/>
                </pattern>
              </defs>

              <!-- Background -->
              <rect width="980" height="540" rx="14" fill="#090d16"/>
              <rect width="980" height="540" rx="14" fill="url(#bbgGrid)"/>

              <!-- Header -->
              <text x="28" y="36" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="800" font-size="18" fill="#f8fafc">WorkflowAutomation.Shared.Kernel — Multi-Tenancy &amp; Context Resolution</text>
              <text x="28" y="55" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#94a3b8">Pure .NET 10 • Zero External NuGet Dependencies • Host-Agnostic Scoping &amp; EF Core Global Query Filters</text>

              <!-- Zone 1: Runtime Hosts (Left Column) -->
              <rect x="24" y="76" width="245" height="436" rx="12" fill="#0f172a" fill-opacity="0.55" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
              <text x="38" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8">① RUNTIME HOSTS (INGRESS)</text>

              <rect x="38" y="114" width="217" height="84" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
              <text x="52" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">API Host (ASP.NET Core)</text>
              <text x="52" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Authenticate User (JWT Claims)</text>
              <text x="52" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Read X-Workspace-Id Header</text>

              <rect x="38" y="216" width="217" height="84" rx="10" fill="#0f172a" stroke="#9333ea" stroke-width="1.5"/>
              <text x="52" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#c084fc">Worker Host (MassTransit)</text>
              <text x="52" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Read RabbitMQ Message Headers</text>
              <text x="52" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Execution Validation Check</text>

              <rect x="38" y="318" width="217" height="84" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
              <text x="52" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">Scheduler (Quartz.NET)</text>
              <text x="52" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Read Quartz JobDataMap</text>
              <text x="52" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Triggered via IClock.UtcNow</text>

              <rect x="38" y="418" width="217" height="78" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
              <text x="52" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#fbbf24">Auth &amp; Membership Guard</text>
              <text x="52" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">"Who are you?" &amp; "Permitted?"</text>
              <text x="52" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fcd34d">Separate from Query Routing</text>

              <!-- Pure SMIL Animated Flow Lines: Hosts -> Shared.Kernel -->
              <path id="pathApi" d="M 255 156 L 324 165" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.9s" repeatCount="indefinite"/>
              </path>
              <circle r="4" fill="#38bdf8">
                <animateMotion dur="1.4s" repeatCount="indefinite" path="M 255 156 L 324 165"/>
              </circle>

              <path id="pathWorker" d="M 255 258 L 324 185" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.9s" repeatCount="indefinite"/>
              </path>
              <circle r="4" fill="#c084fc">
                <animateMotion dur="1.6s" repeatCount="indefinite" path="M 255 258 L 324 185"/>
              </circle>

              <path id="pathSched" d="M 255 360 L 324 205" stroke="#34d399" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.9s" repeatCount="indefinite"/>
              </path>
              <circle r="4" fill="#34d399">
                <animateMotion dur="1.8s" repeatCount="indefinite" path="M 255 360 L 324 205"/>
              </circle>

              <!-- Zone 2: Center Column: Shared.Kernel -->
              <rect x="310" y="76" width="340" height="436" rx="12" fill="#0f172a" fill-opacity="0.55" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
              <text x="326" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#34d399">② SHARED.KERNEL (0 NUGET DEPS)</text>

              <!-- IWorkspaceContext Box -->
              <rect x="326" y="114" width="308" height="118" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
              <text x="342" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">Context / IWorkspaceContext</text>
              <text x="342" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">"Which workspace is active now?" (Routing)</text>
              <text x="342" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e2e8f0">• Guid? CurrentWorkspaceId { get; }</text>
              <text x="342" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e2e8f0">• Guid? CurrentUserId { get; }</text>
              <text x="342" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#34d399">• bool HasCurrentWorkspace { get; }</text>

              <!-- Primitives Box -->
              <rect x="326" y="248" width="308" height="150" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
              <text x="342" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#a5b4fc">Primitives / Contracts &amp; Railway</text>
              <text x="342" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e2e8f0">• IMustHaveWorkspace (WorkspaceId)</text>
              <text x="342" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e2e8f0">• IEntity&lt;TId&gt; → Entity&lt;TId&gt;</text>
              <text x="342" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e2e8f0">• IAuditableEntity → AuditableEntity&lt;TId&gt;</text>
              <text x="342" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fbbf24">• Result&lt;T&gt; + Error + ErrorType</text>
              <text x="342" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Explicit railway outcomes (Zero domain exceptions)</text>

              <!-- Time Box -->
              <rect x="326" y="414" width="308" height="82" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
              <text x="342" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#f472b6">Time / IClock &amp; SystemClock</text>
              <text x="342" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e2e8f0">• DateTimeOffset UtcNow { get; }</text>
              <text x="342" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Deterministic time for auditing &amp; unit tests</text>

              <!-- Pure SMIL Animated Flow Lines: Shared.Kernel -> Persistence -->
              <path d="M 634 175 L 708 175" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 5" fill="none">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" repeatCount="indefinite"/>
              </path>
              <circle r="4.5" fill="#38bdf8">
                <animateMotion dur="1.1s" repeatCount="indefinite" path="M 634 175 L 708 175"/>
              </circle>

              <path d="M 634 300 L 708 225" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.0s" repeatCount="indefinite"/>
              </path>

              <path d="M 634 450 L 708 260" stroke="#f472b6" stroke-width="2" stroke-dasharray="7 5" fill="none">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/>
              </path>

              <!-- Zone 3: Right Column: Infrastructure & Database -->
              <rect x="692" y="76" width="264" height="436" rx="12" fill="#0f172a" fill-opacity="0.55" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 4"/>
              <text x="708" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#a5b4fc">③ INFRASTRUCTURE &amp; DB</text>

              <rect x="708" y="114" width="232" height="170" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
              <text x="722" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#a5b4fc">ApplicationDbContext</text>
              <text x="722" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">EF Core Global Query Filters:</text>
              <text x="722" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#34d399">WHERE WorkspaceId =</text>
              <text x="722" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#38bdf8">  @CurrentWorkspaceId</text>
              <text x="722" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Fail-closed on missing context</text>
              <text x="722" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Auto-stamps CreatedAt/UpdatedAt</text>
              <text x="722" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Safety net (not sole Authz)</text>

              <path d="M 824 284 L 824 334" stroke="#34d399" stroke-width="3" stroke-dasharray="7 5" fill="none">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" repeatCount="indefinite"/>
              </path>
              <circle r="4.5" fill="#34d399">
                <animateMotion dur="1.0s" repeatCount="indefinite" path="M 824 284 L 824 334"/>
              </circle>

              <rect x="708" y="334" width="232" height="162" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
              <text x="722" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">Multi-Tenant Database</text>
              <rect x="722" y="372" width="204" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
              <text x="732" y="393" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6ee7b7">✓ Tenant A Rows (Returned)</text>
              <rect x="722" y="414" width="204" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
              <text x="732" y="435" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">✗ Tenant B Rows (Filtered)</text>
              <text x="722" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Workspace root keyed by Id only</text>
            </svg>